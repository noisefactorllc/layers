name: browser repeat

# Runs one spec many times on one engine, set up as the ci browser job is, to
# reproduce a test that fails only some of the time. It runs only when started
# by hand, with no retries, and keeps the trace of every failed run. It deploys
# nothing.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec file, with an optional line (tests/name.spec.js:122)'
        required: true
        type: string
      browser:
        description: 'Engine'
        required: true
        default: webkit
        type: choice
        options: [webkit, firefox, chromium]
      repeat_each:
        description: 'Times to run the spec'
        required: true
        default: '30'
        type: string
      seek_replay:
        description: 'Also replay the native video seek of tests/video-full-resolution.spec.js:122 on WebKit, with a log for each seek'
        required: false
        default: false
        type: boolean
      replay_mode:
        description: 'Seek replay setup: the spec''s own path, the same with requestVideoFrameCallback armed, or one browser shared by every run'
        required: false
        default: spec-path
        type: choice
        options: [spec-path, with-rvfc, shared-browser]

permissions:
  contents: read

jobs:
  repeat:
    name: Repeat (${{ inputs.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: layers
    env:
      CI: 'true'
      SEANCE_ROOT: ${{ github.workspace }}/seance
      SEANCE_PYTHON: ${{ github.workspace }}/seance/.venv/bin/python
      SPEC: ${{ inputs.spec }}
      BROWSER: ${{ inputs.browser }}
      REPEAT_EACH: ${{ inputs.repeat_each }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit
      - name: Check inputs
        working-directory: .
        run: |
          [[ "$SPEC" =~ ^tests/[A-Za-z0-9._/-]+\.spec\.js(:[0-9]+)?$ ]] || { echo "::error::spec must be tests/<name>.spec.js with an optional :line"; exit 1; }
          [[ "$REPEAT_EACH" =~ ^[1-9][0-9]{0,2}$ ]] || { echo "::error::repeat_each must be a number from 1 to 999"; exit 1; }
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          path: layers
          persist-credentials: false
      - name: Checkout pinned collaboration harness
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: noisefactorllc/seance
          ref: ab95c8b150c2d0be0d697c92bac117bb88031a99
          path: seance
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: layers/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Build collaboration harness
        working-directory: seance
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements.txt
          npm run build:sdk
      - run: npm ci --ignore-scripts
      - name: Restore browser system packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: browser-apt-${{ runner.os }}-${{ inputs.browser }}-${{ hashFiles('layers/package-lock.json') }}
          restore-keys: browser-apt-${{ runner.os }}-${{ inputs.browser }}-
      - name: Install locked browser
        # The same install as the ci browser job, with its apt defences.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
                     /etc/apt/sources.list.d/google-chrome*.sources
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "2";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts > /dev/null
          mkdir -p "$HOME/apt-archives/partial"
          printf 'Dir::Cache::Archives "%s/apt-archives/";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME" \
            | sudo tee /etc/apt/apt.conf.d/81-ci-archives > /dev/null
          installed=
          for attempt in 1 2 3; do
            if timeout --kill-after=30s 6m npx --no-install playwright install --with-deps "$BROWSER"; then
              installed=1
              break
            fi
            echo "::warning::browser install attempt $attempt failed; retrying"
            holders=$(sudo lslocks -n -o PID,PATH 2>/dev/null \
              | awk '$2 ~ /^\/var\/(lib\/dpkg|lib\/apt|cache\/apt)\/|\/apt-archives\// { print $1 }' | sort -u)
            if [ -n "$holders" ]; then
              # shellcheck disable=SC2086 # one PID per word
              sudo kill $holders 2>/dev/null || true
              sleep 5
              # shellcheck disable=SC2086 # one PID per word
              sudo kill -9 $holders 2>/dev/null || true
            fi
            sudo dpkg --configure -a || true
            sudo apt-get update || true
            sleep $((attempt * 15))
          done
          sudo rm -rf "$HOME/apt-archives/partial" "$HOME/apt-archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"
          if [ -z "$installed" ]; then
            echo "::error::browser install failed after 3 attempts"
            exit 1
          fi
      - name: Run the spec repeatedly
        # The browser flags match the ci browser job. --retries=0 keeps every
        # failure a failure, and the config keeps each failed run's trace.
        run: |
          if [ "$BROWSER" = 'webkit' ]; then
            WEBKIT_GST_ALLOW_PLAYBACK_OF_INVISIBLE_VIDEOS=1 xvfb-run -a npx playwright test "$SPEC" --project=webkit --headed --workers=1 --retries=0 --repeat-each="$REPEAT_EACH"
          elif [ "$BROWSER" = 'firefox' ]; then
            xvfb-run -a npx playwright test "$SPEC" --project=firefox --headed --workers=1 --retries=0 --repeat-each="$REPEAT_EACH"
          else
            npx playwright test "$SPEC" --project=chromium --retries=0 --repeat-each="$REPEAT_EACH"
          fi
      - name: Replay the native video seek with a log for each seek
        # The replay follows the spec's own path, a fresh browser for each run,
        # and logs for each seek the video's state when seeked fires, every
        # change in what drawImage drew and the media events. replay_mode
        # turns on requestVideoFrameCallback or one shared browser instead.
        # The page reaches only its own server on loopback.
        if: ${{ always() && inputs.seek_replay }}
        env:
          WEBKIT_GST_ALLOW_PLAYBACK_OF_INVISIBLE_VIDEOS: '1'
          DIAG_HEADED: '1'
          REPLAY_MODE: ${{ inputs.replay_mode }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          case "$REPLAY_MODE" in
            spec-path) ;;
            with-rvfc) export DIAG_RVFC=1 ;;
            shared-browser) export DIAG_SHARED=1 ;;
            *) echo "::error::unknown replay_mode"; exit 1 ;;
          esac
          cat > "$RUNNER_TEMP/diag-v2.mjs" <<'EOF'
          // Diagnostic replay v2 of layers tests/video-full-resolution.spec.js:122,
          // following the spec's own path: a fresh persistent browser per run (as the
          // Layers test fixture gives WebKit), the spec's evaluate code in the spec's
          // order, and no requestVideoFrameCallback unless DIAG_RVFC=1 asks for it.
          // Observation is passive: what each drawImage try drew, the video's state at
          // seeked and at the end, and the media events in between. A run stops at the
          // first reference that never matches, as the spec does, and reports it.
          //
          //   node diag-v2.mjs <layers checkout> <dev server URL> <runs>
          //   DIAG_HEADED=1  headed (CI runs WebKit headed under xvfb-run)
          //   DIAG_RVFC=1    also arm requestVideoFrameCallback (v1's extra step)
          //   DIAG_SHARED=1  one shared browser with a new context per run (v1's setup)
          import { createRequire } from 'node:module'
          import { readFileSync } from 'node:fs'
          import { join, resolve } from 'node:path'

          const [layersDir, baseURL, runsArg] = process.argv.slice(2)
          const root = resolve(layersDir)
          const { webkit } = createRequire(join(root, 'package.json'))('playwright')
          const runs = Number(runsArg || 30)
          const headless = process.env.DIAG_HEADED !== '1'
          const armRvfc = process.env.DIAG_RVFC === '1'
          const shared = process.env.DIAG_SHARED === '1'
          const devPort = new URL(baseURL).port
          const LOOPBACK = /^(?:https?|wss?):\/\/(?:localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0)(?::(\d+))?\//
          const fixture = readFileSync(join(root, 'tests/fixtures/native-video-detail.webm')).toString('base64')

          async function guard(context) {
              await context.route(LOOPBACK, (r) => (LOOPBACK.exec(r.request().url())[1] || '80') === devPort ? r.continue() : r.abort('connectionrefused'))
              await context.routeWebSocket(LOOPBACK, (ws) => ws.close())
          }

          async function replay(context) {
              const page = context.pages()[0] ?? await context.newPage()
              await page.goto(baseURL, { waitUntil: 'networkidle' })
              return page.evaluate(async ({ base64, armRvfc }) => {
                  // The spec's code, in the spec's order, with passive logging added.
                  const app = window.layersApp
                  const bootAtStart = app._initialized === true
                  const source = document.createElement('canvas'); source.width = 1800; source.height = 1200
                  const ctx = source.getContext('2d')
                  const file = new File([Uint8Array.from(atob(base64), c => c.charCodeAt(0))], 'native-detail.webm', { type: 'video/webm' })
                  await app._handleOpenMedia(file, 'video'); app._renderer.stop()
                  if (!app._layers.length) throw new Error('Native video fixture did not import')
                  const media = app._renderer.getMediaInfo(app._layers[0].id)
                  const video = media.videoElement
                  // Passive checks for a boot that finishes during the import: is the app
                  // initialized, how many layers are there, and does the renderer still
                  // hold this same video element with its source?
                  const holds = () => app._layers.length > 0 && app._renderer.getMediaInfo(app._layers[0].id)?.videoElement === video
                  const state = () => ({ t: +video.currentTime.toFixed(3), paused: video.paused, seeking: video.seeking, ready: video.readyState, net: video.networkState,
                      src: !!video.currentSrc, err: video.error?.code ?? null, boot: app._initialized === true, layers: app._layers.length, holds: holds() })
                  const afterImport = state()
                  video.pause()
                  const events = []
                  for (const type of ['seeking', 'seeked', 'pause', 'play', 'playing', 'waiting', 'stalled', 'suspend', 'emptied', 'timeupdate']) {
                      video.addEventListener(type, () => events.push(`${type}@${video.currentTime.toFixed(3)}`))
                  }
                  let vfc = 0
                  if (armRvfc) { const onFrame = () => { vfc++; video.requestVideoFrameCallback?.(onFrame) }; video.requestVideoFrameCallback?.(onFrame) }
                  const seek = time => new Promise((resolve, reject) => {
                      const timer = setTimeout(() => reject(new Error('Native fixture seek timed out')), 10000)
                      video.addEventListener('seeked', () => { clearTimeout(timer); resolve() }, { once: true })
                      video.currentTime = time
                  })
                  if (!Number.isFinite(video.duration) || video.duration <= 0) throw new Error('Native fixture duration was not resolved')
                  const Original = app._renderer.constructor
                  app._renderer.constructor = class extends Original { constructor(...args) { super(...args) } }
                  const session = await app._renderer.createFullResolutionCapture()
                  const log = { bootAtStart, afterImport, seeks: [], vfc: 0 }
                  try {
                      const darkAt = (row, i) => row[i] < 50 && row[i + 1] < 50 && row[i + 2] < 50
                      const brightAt = (row, i) => row[i] > 200 && row[i + 1] > 200 && row[i + 2] > 200
                      for (const time of [0.2, 0.9]) {
                          events.length = 0
                          const t0 = performance.now()
                          await seek(time)
                          const atSeeked = { ...state(), ms: Math.round(performance.now() - t0) }
                          const darkIndex = time < 0.55 ? 4 : 8
                          let expected = null, attempt = 0
                          const seen = []
                          for (; attempt < 50 && !expected; attempt++) {
                              ctx.clearRect(0, 0, 1800, 1200); ctx.drawImage(video, 0, 0)
                              const row = [...ctx.getImageData(899, 600, 4, 1).data]
                              const key = [row[0], row[4], row[8], row[12], row[3]].join(',')
                              if (seen[seen.length - 1]?.key === key) seen[seen.length - 1].n++
                              else seen.push({ key, n: 1, at: Math.round(performance.now() - t0) })
                              if (darkIndex === 4
                                  ? darkAt(row, 4) && brightAt(row, 0) && brightAt(row, 8)
                                  : darkAt(row, 8) && brightAt(row, 0) && brightAt(row, 4)) expected = row
                              else await new Promise(resolve => setTimeout(resolve, 100))
                          }
                          log.seeks.push({ time, ok: !!expected, tries: attempt, atSeeked, end: state(), seen, events: [...events] })
                          if (!expected) break
                          await session.render(time / video.duration)
                      }
                  } finally { await session.dispose(); app._renderer.constructor = Original }
                  log.vfc = vfc
                  return log
              }, { base64: fixture, armRvfc })
          }

          let failed = 0
          const sharedBrowser = shared ? await webkit.launch({ headless }) : null
          try {
              for (let run = 0; run < runs; run++) {
                  // The Layers fixture gives each WebKit test a fresh persistent profile, so a fresh browser.
                  const context = shared ? await sharedBrowser.newContext() : await webkit.launchPersistentContext('', { headless })
                  try {
                      await guard(context)
                      const log = await replay(context)
                      const ok = log.seeks.length === 2 && log.seeks.every((s) => s.ok)
                      if (!ok) failed++
                      console.log(`${ok ? 'OK  ' : 'FAIL'} run ${run}: ${JSON.stringify(log)}`)
                  } catch (error) {
                      failed++
                      console.log(`FAIL run ${run}: ${JSON.stringify({ error: error.message.split('\n')[0] })}`)
                  } finally {
                      await context.close()
                  }
              }
          } finally {
              await sharedBrowser?.close()
          }
          console.log(`runs ${runs}, failed ${failed}, headed ${!headless}, rvfc ${armRvfc}, browser ${shared ? 'shared' : 'fresh persistent per run'}`)
          process.exitCode = failed ? 1 : 0
          EOF
          npx --no-install http-server public -a 127.0.0.1 -p 3102 -c-1 > test-results/diag-server.log 2>&1 &
          server=$!
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:3102/ > /dev/null && break; sleep 1; done
          status=0
          xvfb-run -a node "$RUNNER_TEMP/diag-v2.mjs" "$PWD" http://localhost:3102/ "$REPEAT_EACH" > test-results/diag-v2-webkit.log 2>&1 || status=1
          kill "$server"
          tail -n 1 test-results/diag-v2-webkit.log
          exit "$status"
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-repeat-${{ inputs.browser }}-${{ github.run_id }}
          path: |
            layers/playwright-report/
            layers/test-results/
          retention-days: 14
