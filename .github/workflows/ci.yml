name: ci

on:
  pull_request:
  push:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit

  browser:
    name: Browser (${{ matrix.browser }})
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: layers
    env:
      CI: 'true'
      SEANCE_ROOT: ${{ github.workspace }}/seance
      SEANCE_PYTHON: ${{ github.workspace }}/seance/.venv/bin/python
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          path: layers
      - name: Checkout pinned collaboration harness
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: noisefactorllc/seance
          ref: 3f74d11f87e35dfa9f8f4b769323661901583f92
          path: seance
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: layers/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Build collaboration harness
        working-directory: seance
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements.txt
          npm run build:sdk
      - run: npm ci --ignore-scripts
      - name: Require collaboration harness
        run: node --input-type=module -e "import { hasLocalSeanceHarness } from './tests/seanceLocal.js'; if (!hasLocalSeanceHarness()) throw new Error('Seance harness unavailable')"
      - name: Install locked browser
        run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - name: Test all browser and pixel regressions
        run: |
          if [ '${{ matrix.browser }}' = 'webkit' ]; then
            # Match WebKit's GLib test runner for offscreen video textures.
            WEBKIT_GST_ALLOW_PLAYBACK_OF_INVISIBLE_VIDEOS=1 xvfb-run -a npm test -- --project=webkit --headed --workers=1
          else
            npm test -- --project=${{ matrix.browser }}
          fi
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-${{ matrix.browser }}-${{ github.sha }}
          path: |
            layers/playwright-report/
            layers/test-results/
          retention-days: 14
