name: ci

on:
  pull_request:
  push:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. Without this every push started a parallel run and nothing
# cancelled anything, so four commits in half an hour meant four overlapping
# 100-minute webkit legs, about six and a half hours of runner time to learn
# one thing. Only the newest commit's run survives, which also matches the
# release guard: the newest green commit is the only deploy candidate.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit

  browser:
    name: Browser (${{ matrix.browser }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: source
    runs-on: ubuntu-latest
    # Backstop only, above Playwright's globalTimeout so that fires first and
    # leaves a report. A shard is a fraction of a leg, so this is far above
    # anything a healthy shard takes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Shards, sized from measurement rather than symmetry. The whole suite is
      # 963 tests per engine and the engines are not comparable: on run
      # 34367638949 the test step took 76.7 minutes for webkit, 56.8 for
      # chromium and 41.3 for firefox, while everything around it, both
      # checkouts, the harness build, npm ci and the browser install, took 2.1.
      # Setup is therefore nearly free and wall clock is almost entirely the
      # test step, so splitting that step is the only lever that matters.
      #
      # Each engine gets the shard count that puts its slowest observed leg
      # under about fifteen minutes, which leaves the whole harness inside
      # twenty: webkit's worst leg was 100.4, chromium's 60.9, firefox's 48.8.
      # Playwright splits by file and files differ in size, so the counts carry
      # room for an uneven split rather than assuming a perfect one. Seventeen
      # jobs is also deliberate: it stays under the twenty concurrent jobs a
      # public repository gets, because a shard that queues costs exactly the
      # wall clock this axis was added to save. Re-measure before changing
      # these; a shard count picked to look tidy will either miss the target or
      # burn runners for nothing.
      matrix:
        include:
          - { browser: chromium, shard: 1, shards: 5 }
          - { browser: chromium, shard: 2, shards: 5 }
          - { browser: chromium, shard: 3, shards: 5 }
          - { browser: chromium, shard: 4, shards: 5 }
          - { browser: chromium, shard: 5, shards: 5 }
          - { browser: firefox, shard: 1, shards: 4 }
          - { browser: firefox, shard: 2, shards: 4 }
          - { browser: firefox, shard: 3, shards: 4 }
          - { browser: firefox, shard: 4, shards: 4 }
          - { browser: webkit, shard: 1, shards: 8 }
          - { browser: webkit, shard: 2, shards: 8 }
          - { browser: webkit, shard: 3, shards: 8 }
          - { browser: webkit, shard: 4, shards: 8 }
          - { browser: webkit, shard: 5, shards: 8 }
          - { browser: webkit, shard: 6, shards: 8 }
          - { browser: webkit, shard: 7, shards: 8 }
          - { browser: webkit, shard: 8, shards: 8 }
    defaults:
      run:
        working-directory: layers
    env:
      CI: 'true'
      SEANCE_ROOT: ${{ github.workspace }}/seance
      SEANCE_PYTHON: ${{ github.workspace }}/seance/.venv/bin/python
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5
        with:
          egress-policy: audit
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          path: layers
      - name: Checkout pinned collaboration harness
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: noisefactorllc/seance
          ref: 2dc407c13b897e67d21527a69eb6e8439a1a1d45
          path: seance
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: layers/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Build collaboration harness
        working-directory: seance
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements.txt
          npm run build:sdk
      - run: npm ci --ignore-scripts
      - name: Require collaboration harness
        run: node --input-type=module -e "import { hasLocalSeanceHarness } from './tests/seanceLocal.js'; if (!hasLocalSeanceHarness()) throw new Error('Seance harness unavailable')"
      - name: Install locked browser
        # `--with-deps` runs apt, so this step depends on external mirrors
        # being consistent. One of them was not, and it cost four consecutive
        # runs before a single test executed. Two defences, in order: remove
        # the repository that broke, then retry what remains. The sleep in the
        # retry is a backoff against someone else's server, not a guess at our
        # own readiness, which is the distinction the rest of this suite turns
        # on.
        run: |
          # The runner image carries Google's Chrome apt repository, and every
          # apt-get update consults it, including the ones inside this retry.
          # Nothing here needs it: Playwright installs its own pinned browser
          # binaries, and --with-deps only wants system libraries from the
          # Ubuntu archive. It served a stale index for four consecutive runs
          # of this suite, failing all three browser jobs before any test ran,
          # and retrying could not help because the mismatch persisted across
          # the whole window. Drop the source rather than keep asking it.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
                     /etc/apt/sources.list.d/google-chrome*.sources
          for attempt in 1 2 3; do
            if npx --no-install playwright install --with-deps ${{ matrix.browser }}; then
              exit 0
            fi
            echo "::warning::browser install attempt $attempt failed; retrying"
            sudo apt-get update || true
            sleep $((attempt * 15))
          done
          echo "::error::browser install failed after 3 attempts"
          exit 1
      - name: Record shader release before testing
        run: |
          mkdir -p dependency-evidence
          curl --fail --silent --show-error --max-time 30 https://shaders.noisedeck.app/1/deployment-meta.json > dependency-evidence/shaders-before.json
      - name: Test this shard of the browser and pixel regressions
        env:
          SHARD: --shard=${{ matrix.shard }}/${{ matrix.shards }}
        run: |
          if [ '${{ matrix.browser }}' = 'webkit' ]; then
            # Match WebKit's GLib test runner for offscreen video textures.
            # One worker stays: WebKit's parallelism comes from the shard axis,
            # not from crowding a four core runner with software rendered
            # engines that then time each other out.
            WEBKIT_GST_ALLOW_PLAYBACK_OF_INVISIBLE_VIDEOS=1 xvfb-run -a npm test -- --project=webkit --headed --workers=1 "$SHARD"
          elif [ '${{ matrix.browser }}' = 'firefox' ]; then
            # Provide a display for WebGL2 in the Linux CI environment.
            xvfb-run -a npm test -- --project=firefox --headed "$SHARD"
          else
            npm test -- --project=${{ matrix.browser }} "$SHARD"
          fi
      - name: Record shader release after testing
        if: always()
        run: |
          mkdir -p dependency-evidence
          curl --fail --silent --show-error --max-time 30 https://shaders.noisedeck.app/1/deployment-meta.json > dependency-evidence/shaders-after.json
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-${{ matrix.browser }}-${{ matrix.shard }}-of-${{ matrix.shards }}-${{ github.sha }}
          path: |
            layers/playwright-report/
            layers/test-results/
            layers/dependency-evidence/
          retention-days: 14
